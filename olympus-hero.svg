<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
  <title id="title">Olympus avatar council: Zeus, Odin, and Thor</title>
  <desc id="desc">Three original mythic avatar portraits in circular storm medallions: Zeus as commander, Odin as counsel, and Thor as builder.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#02050d"/><stop offset=".55" stop-color="#0d162b"/><stop offset="1" stop-color="#03050b"/></linearGradient>
    <radialGradient id="storm" cx="50%" cy="36%"><stop stop-color="#b9f3ff" stop-opacity=".4"/><stop offset=".25" stop-color="#236ba1" stop-opacity=".34"/><stop offset=".68" stop-color="#111d3c" stop-opacity=".92"/><stop offset="1" stop-color="#02050c"/></radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset=".22" stop-color="#98afc8"/><stop offset=".52" stop-color="#28364f"/><stop offset=".8" stop-color="#11192d"/><stop offset="1" stop-color="#c7d8e8"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff2ae"/><stop offset=".35" stop-color="#eac16e"/><stop offset=".68" stop-color="#70482d"/><stop offset="1" stop-color="#f6da8d"/></linearGradient>
    <linearGradient id="redmetal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe1ad"/><stop offset=".3" stop-color="#b56c59"/><stop offset=".72" stop-color="#432c43"/><stop offset="1" stop-color="#e0ae76"/></linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9fdff"/><stop offset=".35" stop-color="#86dff5"/><stop offset=".7" stop-color="#314e89"/><stop offset="1" stop-color="#bd9dff"/></linearGradient>
    <filter id="electric" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="aura" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="26"/></filter>
    <clipPath id="left"><circle cx="310" cy="470" r="350"/></clipPath>
    <clipPath id="center"><circle cx="900" cy="470" r="350"/></clipPath>
    <clipPath id="right"><circle cx="1490" cy="470" r="350"/></clipPath>
