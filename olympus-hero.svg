<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">Olympus backdrop for the Thor avatar</title>
  <desc id="desc">A restrained cinematic Olympus backdrop for the supplied Thor 2D avatar, with a dark celestial field, Mount Olympus silhouette, gold geometry, and the three Hermes authority lanes named below.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#03050d"/><stop offset=".52" stop-color="#10192e"/><stop offset="1" stop-color="#050711"/></linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="50%"><stop stop-color="#bdf5ff" stop-opacity=".38"/><stop offset=".26" stop-color="#438dd0" stop-opacity=".2"/><stop offset=".62" stop-color="#6d4bb2" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3f5275"/><stop offset=".42" stop-color="#151d36"/><stop offset="1" stop-color="#050711"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff2b0"/><stop offset=".35" stop-color="#e4b967"/><stop offset="1" stop-color="#6b452e"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="14" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="38"/></filter>
    <pattern id="stars" width="170" height="115" patternUnits="userSpaceOnUse"><circle cx="18" cy="22" r="1.2" fill="#fff" opacity=".65"/><circle cx="82" cy="70" r="1" fill="#b9f3ff" opacity=".65"/><circle cx="145" cy="38" r="1.5" fill="#f8db8a" opacity=".58"/><circle cx="126" cy="103" r=".8" fill="#fff" opacity=".6"/></pattern>
  </defs>

  <rect width="1800" height="900" fill="url(#sky)"/>
  <rect width="1800" height="640" fill="url(#stars)" opacity=".75"/>
  <ellipse cx="900" cy="370" rx="610" ry="430" fill="url(#halo)"/>
  <ellipse cx="900" cy="410" rx="310" ry="300" fill="#8deaff" opacity=".12" filter="url(#soft)"/>

  <!-- restrained Olympus geometry -->
  <g fill="none" stroke-linecap="round">
    <path d="M125 178H520M1280 178H1675" stroke="url(#gold)" stroke-width="2" opacity=".72"/>
    <path d="M205 178V202M485 178V202M1315 178V202M1595 178V202" stroke="#82dff2" stroke-width="2" opacity=".55"/>
    <path d="M270 118L310 78L350 118L390 78L430 118M1370 118L1410 78L1450 118L1490 78L1530 118" stroke="#8deaff" stroke-width="2" opacity=".34"/>
    <circle cx="900" cy="394" r="350" stroke="url(#gold)" stroke-width="2" opacity=".7"/>
    <circle cx="900" cy="394" r="330" stroke="#8deaff" stroke-width="1.5" stroke-dasharray="2 18" opacity=".7"/>
    <path d="M900 48V105M900 683V740" stroke="#f2cf7c" stroke-width="3" opacity=".65"/>
  </g>

  <!-- distant temple and mountain silhouette -->
  <g opacity=".58">
    <path d="M0 745L190 620L310 690L485 495L625 690L900 345L1175 690L1315 495L1490 690L1610 620L1800 745V900H0Z" fill="url(#mountain)"/>
    <path d="M0 786L220 675L330 741L485 560L630 741L900 420L1170 741L1315 560L1470 741L1580 675L1800 786V900H0Z" fill="#060914"/>
    <path d="M625 778L900 405L1175 778" fill="none" stroke="#9bb4cf" stroke-opacity=".42" stroke-width="3"/>
    <path d="M680 778L900 482L1120 778" fill="none" stroke="#ebc878" stroke-opacity=".54" stroke-width="3"/>
    <path d="M740 785V630M795 785V555M850 785V490M950 785V490M1005 785V555M1060 785V630" stroke="#9db7cc" stroke-opacity=".42" stroke-width="8"/>
    <path d="M710 785H1090M670 806H1130" stroke="#e5bd6a" stroke-opacity=".5" stroke-width="3"/>
  </g>

  <!-- atmospheric energy behind the supplied avatar -->
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M575 224L655 296L620 322L716 370L653 407L748 470" stroke="#8deaff" stroke-width="4" opacity=".62"/>
    <path d="M1225 224L1145 296L1180 322L1084 370L1147 407L1052 470" stroke="#8deaff" stroke-width="4" opacity=".62"/>
    <path d="M900 55V126M900 662V733" stroke="#f9dc88" stroke-width="4" opacity=".78"/>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">
    <text x="900" y="54" fill="#f2cf7c" font-size="15" letter-spacing="9">OUTLAW INTELLIGENCE</text>
    <text x="900" y="786" fill="#f4f8ff" font-size="42" letter-spacing="16">OLYMPUS</text>
    <text x="900" y="824" fill="#9eddeb" font-size="14" letter-spacing="4">THOR · BUILD LANE · HERMES AVATAR COMMAND</text>
    <text x="270" y="850" fill="#c6d5e5" font-size="13" letter-spacing="3">ZEUS / COMMAND</text>
    <text x="1530" y="850" fill="#c6d5e5" font-size="13" letter-spacing="3">ODIN / COUNSEL</text>
  </g>
</svg>
